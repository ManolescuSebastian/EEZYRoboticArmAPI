<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
    <meta name="theme-color" content="#0e0f12">
    <title>EEZY Arm Control</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<header class="topbar">
    <div class="brand">
        <span class="dot" id="status-dot"></span>
        <span>EEZY ARM</span>
    </div>
    <button id="btn-stop" class="btn-stop" aria-label="Emergency stop">STOP</button>
</header>

<main class="stage">
    <!-- Shoulder (up/down) column -->
    <section class="joint" aria-label="Shoulder">
        <h2>SHOULDER</h2>
        <button class="pad up"   data-axis="up"   aria-label="Up">▲</button>
        <button class="pad down" data-axis="down" aria-label="Down">▼</button>
    </section>

    <!-- Arm schematic — EEZYbotARM MK3 side view -->
    <section class="arm-visual" aria-hidden="true">
        <svg viewBox="0 0 220 260" width="100%" height="100%">
            <!-- Ground shadow -->
            <ellipse cx="110" cy="248" rx="80" ry="6" class="arm-shadow"/>

            <!-- Base: trapezoidal cylinder with a motor hump on the side -->
            <g id="viz-base">
                <path d="M 60 245 L 70 190 L 150 190 L 160 245 Z" class="arm-base-body"/>
                <ellipse cx="110" cy="190" rx="40" ry="7" class="arm-base-top"/>
                <!-- small base-motor nub -->
                <circle cx="155" cy="222" r="8" class="arm-base-motor"/>
                <!-- base rotation indicator (hidden by default; shown when base moves) -->
                <g id="viz-base-rotation" class="rot-indicator">
                    <path d="M 70 205 Q 110 195 150 205" fill="none" class="rot-arrow"/>
                    <polygon points="150,205 144,200 144,210" class="rot-arrow-head" id="rot-head-cw"/>
                    <polygon points="70,205 76,200 76,210"   class="rot-arrow-head" id="rot-head-ccw"/>
                </g>
            </g>

            <!-- Pivot block on top of the base (shoulder joint anchor) -->
            <rect x="95" y="178" width="30" height="14" rx="2" class="arm-pivot"/>
            <circle cx="110" cy="185" r="3.5" class="arm-joint-dot"/>

            <!-- Shoulder+Forearm assembly. The parallelogram linkage keeps the
                 forearm/wrist bar level regardless of shoulder angle. Rotating
                 this whole <g> around the shoulder pivot handles up/down. -->
            <g id="viz-shoulder" style="transform-origin: 110px 185px;">
                <!-- Rear control arm (the thinner parallelogram link) -->
                <line x1="110" y1="185" x2="150" y2="110"
                      class="arm-link" stroke-linecap="round"/>
                <!-- Main shoulder arm (thick back arm) -->
                <path d="M 102 185 L 94 110 L 110 108 L 118 183 Z" class="arm-segment-main"/>

                <!-- Elbow pivot at the top -->
                <circle cx="106" cy="110" r="4" class="arm-joint-dot"/>

                <!-- Forearm assembly — rotates about the elbow pivot. -->
                <g id="viz-elbow" style="transform-origin: 106px 110px;">
                    <!-- Lower forearm bar (main structural member) -->
                    <path d="M 106 110 L 180 100 L 184 112 L 110 122 Z"
                          class="arm-segment-main"/>
                    <!-- Upper parallelogram bar (keeps claw level) -->
                    <line x1="124" y1="98" x2="186" y2="90"
                          class="arm-link" stroke-linecap="round"/>
                    <!-- Wrist pivot -->
                    <circle cx="182" cy="106" r="3.5" class="arm-joint-dot"/>

                    <!-- Claw assembly — opens/closes via group pivots. -->
                    <g id="viz-claw" style="transform-origin: 182px 106px;">
                        <!-- Claw body / servo horn -->
                        <rect x="178" y="100" width="14" height="12" rx="2"
                              class="arm-claw-body"/>
                        <!-- Upper finger -->
                        <g id="viz-claw-upper" style="transform-origin: 192px 102px;">
                            <path d="M 192 102 L 212 96 L 213 100 L 193 106 Z"
                                  class="arm-claw-finger-shape"/>
                        </g>
                        <!-- Lower finger -->
                        <g id="viz-claw-lower" style="transform-origin: 192px 112px;">
                            <path d="M 192 112 L 212 118 L 213 114 L 193 108 Z"
                                  class="arm-claw-finger-shape"/>
                        </g>
                    </g>
                </g>
            </g>
        </svg>
    </section>

    <!-- Elbow (forward/backward) column -->
    <section class="joint" aria-label="Elbow">
        <h2>ELBOW</h2>
        <button class="pad fwd"  data-axis="forward"  aria-label="Forward">◀</button>
        <button class="pad bwd"  data-axis="backward" aria-label="Backward">▶</button>
    </section>
</main>

<section class="base-row" aria-label="Base rotation">
    <button class="pad rot-ccw" data-axis="rotate_ccw" aria-label="Rotate counter-clockwise">↺</button>
    <div class="base-label">BASE</div>
    <button class="pad rot-cw" data-axis="rotate_cw" aria-label="Rotate clockwise">↻</button>
</section>

<section class="sliders">
    <div class="slider-row">
        <label for="speed" class="slider-label">
            SPEED <span id="speed-value">5</span>
        </label>
        <input id="speed" type="range" min="1" max="10" step="1" value="5">
    </div>
    <div class="slider-row">
        <label for="claw" class="slider-label">
            CLAW <span id="claw-value">0°</span>
        </label>
        <input id="claw" type="range" min="0" max="180" step="1" value="0">
    </div>
</section>

<footer class="recorder">
    <div class="rec-info">
        <span class="rec-count">
            <span class="rec-indicator" id="rec-indicator"></span>
            <span id="rec-count">0</span> steps
        </span>
        <span class="rec-last" id="rec-last">idle</span>
    </div>
    <div class="rec-actions">
        <button id="btn-record" class="rec-btn record">● Rec</button>
        <button id="btn-replay" class="rec-btn primary">Replay</button>
    </div>
</footer>

<script src="{{ url_for('static', filename='app.js') }}"></script>
</body>
</html>
